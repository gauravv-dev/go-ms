apiVersion: v1
kind: Secret
metadata:
  name: go-ms-secrets
type: Opaque
stringData:
  # PostgreSQL connection string
  # Format: postgres://user:password@postgres-service:5432/dbname
  database-url: "postgres://bookuser:bookpass@postgres:5432/bookdb"

  # Comma-separated API keys
  api-keys: "prod-key-123,prod-key-456"
