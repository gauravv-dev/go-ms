apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: go-ms

resources:
  - ../../base
  - ../../postgres

images:
  - name: ghcr.io/gauravv-dev/go-ms
    newName: ghcr.io/gauravv-dev/go-ms
    newTag: latest

# Production-specific patches
patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
      name: go-ms

  - patch: |-
      - op: replace
        path: /spec/resources/requests/memory
        value: "128Mi"
      - op: replace
        path: /spec/resources/requests/cpu
        value: "100m"
      - op: replace
        path: /spec/resources/limits/memory
        value: "256Mi"
      - op: replace
        path: /spec/resources/limits/cpu
        value: "500m"
    target:
      kind: Deployment
      name: go-ms

# Note: Secrets must be created manually for production security
# Create with:
#   kubectl create secret generic go-ms-secrets -n go-ms --from-literal=database-url="postgres://bookuser:bookdb@postgres:5432/bookdb" --from-literal=api-keys="prod-key-123"
#   kubectl create secret generic postgres-secrets -n go-ms --from-literal=postgres-password="bookdb"
