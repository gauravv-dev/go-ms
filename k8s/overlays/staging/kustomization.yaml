apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: go-ms-staging

resources:
  - ../../base
  - ../../postgres

images:
  - name: ghcr.io/gauravv/dev-go-ms-api
    newName: ghcr.io/gauravv/dev-go-ms-api
    newTag: latest

# Staging-specific patches
patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: go-ms

# Staging secrets (less secure, for testing)
secretGenerator:
  - name: go-ms-secrets
    behavior: replace
    literals:
      - database-url=postgres://bookuser:staging-pass@postgres:5432/bookdb
      - api-keys=staging-key-123

  - name: postgres-secrets
    behavior: replace
    literals:
      - postgres-password=staging-pass
