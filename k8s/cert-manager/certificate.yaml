apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: go-ms-cert
  namespace: go-ms
spec:
  secretName: go-ms-cert
  duration: 2160h  # 90 days
  renewBefore: 720h  # 30 days before expiry
  subject:
    organizations:
    - "gauravv.dev"
  commonName: dev-go-ms-api.gauravv.dev
  dnsNames:
  - dev-go-ms-api.gauravv.dev
  issuerRef:
    name: letsencrypt-cloudflare
    kind: ClusterIssuer
