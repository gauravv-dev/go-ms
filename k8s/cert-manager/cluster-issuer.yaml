apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-cloudflare
spec:
  acme:
    # Let's Encrypt production server
    server: https://acme-v02.api.letsencrypt.org/directory
    # Email to receive expiration notices
    email: gauravaws20@gmail.com
    privateKeySecretRef:
      name: letsencrypt-cloudflare
    solvers:
    - dns01:
        cloudflare:
          email: gauravaws20@gmail.com
          apiTokenSecretRef:
            name: cloudflare-api-token
            key: api-token
