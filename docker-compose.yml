version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: go-ms-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bookuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bookpass}
      POSTGRES_DB: ${POSTGRES_DB:-bookdb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bookuser}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: go-ms-app
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DATABASE_URL: postgres://bookuser:bookpass@postgres:5432/bookdb
      API_KEYS: dev-key-123,prod-key-456
      AUTH_ENABLED: true
      LOG_LEVEL: info
      ALLOWED_ORIGINS: "*"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Development service with hot reload
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: go-ms-app-dev
    ports:
      - "8081:8080"
    environment:
      PORT: 8080
      DATABASE_URL: postgres://bookuser:bookpass@postgres:5432/bookdb
      API_KEYS: dev-key-123
      AUTH_ENABLED: false
      LOG_LEVEL: debug
      ALLOWED_ORIGINS: "*"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - dev

volumes:
  postgres_data:
